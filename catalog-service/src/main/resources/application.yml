# Catalog service. HTTP 8083 is health and Prometheus.
# gRPC CheckSku listens on 9090. Those are two servers:
# Tomcat for HTTP, Netty for gRPC.
server:
  port: 8083

spring:
  application:
    name: catalog-service
  grpc:
    server:
      port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
