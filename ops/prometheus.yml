# Prometheus pulls these endpoints every 5 seconds.
# Grafana queries Prometheus. The apps do not push metrics here.
# Jaeger is for traces and is not in this file.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"]
  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8083"]
